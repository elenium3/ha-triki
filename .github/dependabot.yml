version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # one pull request for all action bumps; github/codeql-action init and
      # analyze must move together or the analyze step fails
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      # the test toolchain moves together with the Home Assistant release it pins
      test-toolchain:
        patterns:
          - "*"
