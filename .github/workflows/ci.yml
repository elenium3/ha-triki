name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # weekly: hassfest and HACS validation track upstream rule changes
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    # the HACS action refuses private repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx ruff check custom_components tests tools
      - run: uvx ruff format --check custom_components tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"  # the pinned toolchain is Home Assistant 2026.10
      - run: pip install -r requirements_test.txt
      # the bluetooth component imports usb; install both components' pinned
      # requirements from the installed Home Assistant's manifests
      - run: |
          pip install $(python - <<'EOF'
          import json, pathlib, homeassistant
          base = pathlib.Path(homeassistant.__file__).parent / "components"
          reqs = []
          for component in ("bluetooth", "usb"):
              reqs += json.load(open(base / component / "manifest.json"))["requirements"]
          print(" ".join(reqs))
          EOF
          )
      - run: mypy
      - run: pytest --cov --cov-fail-under=95

  compat:
    # the suite against the oldest supported core and the newest release: the
    # pinned toolchain above cannot see what a new core changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min
            python: "3.13"  # the last Python of the 2025.x cores
            # aiodns pinned by the 2025.8 constraints breaks with pycares 5 (the
            # value is word-split by the shell, not re-parsed: no quotes needed)
            install: homeassistant==2025.8.3 pytest-homeassistant-custom-component pycares<5
          - name: latest
            python: "3.14"  # on 3.13 pip would quietly resolve to the last 2026.2 toolchain
            install: pytest-homeassistant-custom-component
    name: compat (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - env:
          INSTALL: ${{ matrix.install }}
        run: pip install $INSTALL
      - run: |
          pip install $(python - <<'EOF'
          import json, pathlib, homeassistant
          base = pathlib.Path(homeassistant.__file__).parent / "components"
          reqs = []
          for component in ("bluetooth", "usb"):
              reqs += json.load(open(base / component / "manifest.json"))["requirements"]
          print(" ".join(reqs))
          EOF
          )
      - run: python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: pytest -p no:cacheprovider --no-cov
